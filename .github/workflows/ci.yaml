---
name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  code_quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache

      - name: Install Tools
        run: |
          echo "Installing necessary quality tools..."
          npm install -g eslint prettier htmlhint stylelint markdownlint-cli
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ESLint (JS/TS)
        run: |
          echo "Running ESLint..."
          eslint . --ext .js,.ts || true

      - name: Run HTMLHint
        run: |
          echo "Linting HTML files..."
          htmlhint "**/*.html" || true

      - name: Run Stylelint (CSS)
        run: |
          echo "Linting CSS files..."
          stylelint "**/*.css" || true

      - name: Run Markdownlint
        run: |
          echo "Linting Markdown files..."
          markdownlint "**/*.md" || true

      - name: Run ShellCheck
        run: |
          echo "Linting shell scripts..."
          find . -type f -name "*.sh" -exec shellcheck {} + || true

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Gateway Tests
        run: pnpm --filter @InteraOne/gateway test
