name: Build & Push Docker Images

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve the image tag:
      #   - workflow_dispatch → user-provided version
      #   - tag push (v1.0.0) → 1.0.0
      #   - branch push (main) → latest
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── GATEWAY ──────────────────────────────────────────────────────────
      - name: Build & push Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./apps/gateway
          file: ./apps/gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/interaone-gateway:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/interaone-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── CONSOLE ──────────────────────────────────────────────────────────
      # Built with __VITE_*__ placeholder values.
      # entrypoint.sh replaces them at container startup from .env.docker
      # so this is a generic image that works with any domain.
      - name: Build & push Console
        uses: docker/build-push-action@v6
        with:
          context: ./apps/console
          file: ./apps/console/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/interaone-console:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/interaone-console:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── AGENT ───────────────────────────────────────────────────────────
      - name: Build & push Agent
        uses: docker/build-push-action@v6
        with:
          context: ./apps/agent
          file: ./apps/agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/interaone-agent:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/interaone-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── WORKER ───────────────────────────────────────────────────────────
      - name: Build & push Worker
        uses: docker/build-push-action@v6
        with:
          context: ./apps/worker
          file: ./apps/worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/interaone-worker:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/interaone-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── LAUNCHER ───────────────────────────────────────────────────────────
      # Builds the widget JS bundle and packages it with the deploy script.
      # The widget-deploy service in docker-compose runs this image on startup
      # to push InteraOne.js into MinIO automatically.
      - name: Build & push Launcher
        uses: docker/build-push-action@v6
        with:
          context: ./apps/launcher
          file: ./apps/launcher/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/interaone-launcher:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/interaone-launcher:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "### 🚀 Released \`${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| interaone-gateway  | \`${{ steps.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| interaone-console  | \`${{ steps.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| interaone-agent    | \`${{ steps.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| interaone-worker   | \`${{ steps.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| interaone-launcher | \`${{ steps.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
